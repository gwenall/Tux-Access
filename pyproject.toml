[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuxaccess"
version = "0.9.2"
readme = "README.md"
description = "Unofficial Linux launcher and product manager for Native Instruments software"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyzmq>=27,<28"]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]

[project.scripts]
tuxaccess = "tux_access.cli:main"
native-access-linux = "tux_access.cli:main"

[tool.setuptools.packages.find]
include = ["tux_access*"]

[tool.setuptools.package-data]
"tux_access.resources" = ["artwork/*.png", "*.sh"]
"tux_access.protocol" = ["*.proto"]

[tool.setuptools.data-files]
"share/applications" = ["assets/tuxaccess.desktop"]
"share/native-access-linux" = ["README.md"]
"share/native-access-linux/docs" = ["docs/*.md", "docs/*.txt", "docs/*.json"]
"share/native-access-linux/tools" = ["tools/vst_dsp_probe.py"]
"share/native-access-linux/docs/images" = ["docs/images/*.png"]
