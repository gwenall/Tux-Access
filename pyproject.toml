[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuxaccess"
version = "0.9.2"
readme = "README.md"
description = "Unofficial Linux launcher and product manager for Native Instruments software"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyzmq>=27,<28"]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]

[project.scripts]
tuxaccess = "launcher:main"
native-access-linux = "launcher:main"

[tool.setuptools]
py-modules = ["launcher", "qt_launcher", "sidebar_art", "app_settings", "install_coordinator", "application_catalog", "bundle_catalog", "bundle_catalog_data", "application_backends", "removal_coordinator", "wine_manager", "wine_display", "kontakt_890_plan", "maschine_manager", "maschine_2184_plan", "ni_application_manager", "massive_manager", "massive_170_plan", "controller_editor_manager", "controller_282_plan", "oauth_login", "oauth_browser", "oauth_callback", "arch_package", "ntk_protocol", "schema_codec", "ntk_schema_data", "account_auth", "auth_transport", "account_api", "account_profile", "download_catalog", "download_manager", "package_inspection"]

[tool.setuptools.data-files]
"share/applications" = ["assets/tuxaccess.desktop"]
"share/native-access-linux" = ["README.md", "ntk_readonly.proto"]
"share/native-access-linux/docs" = ["docs/*.md", "docs/*.txt", "docs/*.json"]
"share/native-access-linux/tools" = ["tools/prepare_arch_compat.sh", "tools/vst_dsp_probe.py"]
"share/native-access-linux/docs/images" = ["docs/images/*.png"]
"share/native-access-linux/assets/tux" = ["assets/tux/*.png"]
